server.port=8082

spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5435}/document_db
spring.datasource.username=${local.postgres.username:${SPRING_DATASOURCE_USERNAME:documind_app}}
spring.datasource.password=${local.postgres.password:${SPRING_DATASOURCE_PASSWORD:}}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:documind}
spring.rabbitmq.password=${local.rabbitmq.password:${RABBITMQ_PASSWORD:}}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:}

app.minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
app.minio.access-key=${MINIO_ACCESS_KEY:documind}
app.minio.secret-key=${MINIO_SECRET_KEY:documind-secret}
app.minio.bucket=${MINIO_BUCKET:documents}
