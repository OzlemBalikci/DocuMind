spring.datasource.url=jdbc:h2:mem:documentdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/documind
app.security.audience=documind-api
app.minio.endpoint=http://127.0.0.1:9
app.minio.access-key=test
app.minio.secret-key=test-secret
app.minio.bucket=test
spring.autoconfigure.exclude=org.springframework.boot.amqp.autoconfigure.RabbitAutoConfiguration
