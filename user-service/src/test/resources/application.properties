spring.profiles.active=test
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/documind
app.security.audience=documind-api
app.account.reauth-max-age=5m
app.account.default-quota-limit=100
app.keycloak.admin-base-url=http://127.0.0.1:9
app.keycloak.token-uri=http://127.0.0.1:9/token
app.keycloak.realm=documind
app.keycloak.admin.client-id=user-service-admin
app.keycloak.admin.client-secret=test
app.keycloak.internal.client-id=user-service-internal
app.keycloak.internal.client-secret=test
app.clients.document-base-url=http://127.0.0.1:9
app.clients.chat-base-url=http://127.0.0.1:9
app.outbox.max-attempts=10
app.outbox.stuck-after=10m
spring.task.scheduling.enabled=false
