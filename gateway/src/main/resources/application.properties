spring.application.name=gateway
spring.config.import=optional:file:.env[.properties]
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
server.forward-headers-strategy=none
logging.pattern.level=%5p [${spring.application.name:},%X{correlationId:-}]

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER:http://localhost:8180/realms/documind}
app.security.audience=${KEYCLOAK_AUDIENCE:documind-api}
app.security.protect-internal=false
