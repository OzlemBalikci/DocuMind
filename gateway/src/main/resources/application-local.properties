server.port=${PORT:8087}

# Socket address is the rate-limit key. Do not trust X-Forwarded-For on this edge.
server.tomcat.max-http-form-post-size=${app.gateway.max-request-size:2MB}
server.tomcat.max-swallow-size=${app.gateway.max-request-size:2MB}
spring.servlet.multipart.max-file-size=${app.gateway.max-request-size:2MB}
spring.servlet.multipart.max-request-size=${app.gateway.max-request-size:2MB}

spring.http.clients.connect-timeout=2s
spring.http.clients.read-timeout=30s

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5199}
app.gateway.auth-uri=${AUTH_SERVICE_URI:http://localhost:8081}
app.gateway.document-uri=${DOCUMENT_SERVICE_URI:http://localhost:8082}
app.gateway.chat-uri=${CHAT_SERVICE_URI:http://localhost:8083}
app.gateway.max-request-size=2MB
app.gateway.login-capacity=5
app.gateway.login-period=1m
app.gateway.chat-capacity=30
app.gateway.chat-period=1m

resilience4j.circuitbreaker.instances.auth-login.sliding-window-size=20
resilience4j.circuitbreaker.instances.auth-login.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.auth-login.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.auth-login.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.auth.sliding-window-size=20
resilience4j.circuitbreaker.instances.auth.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.auth.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.auth.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.documents.sliding-window-size=20
resilience4j.circuitbreaker.instances.documents.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.documents.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.documents.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.chat.sliding-window-size=20
resilience4j.circuitbreaker.instances.chat.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.chat.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.chat.wait-duration-in-open-state=10s

resilience4j.timelimiter.instances.auth-login.timeout-duration=5s
resilience4j.timelimiter.instances.auth.timeout-duration=5s
resilience4j.timelimiter.instances.documents.timeout-duration=5s
resilience4j.timelimiter.instances.chat.timeout-duration=30s



app.edge.rate-limit.redis-uri=${REDIS_URI:redis://localhost:6379}

app.edge.rate-limit.policies.login.capacity=10
app.edge.rate-limit.policies.login.period=1m
app.edge.rate-limit.policies.login.key=IP
app.edge.rate-limit.policies.login.on-store-error=CLOSED

app.edge.rate-limit.policies.register.capacity=5
app.edge.rate-limit.policies.register.period=10m
app.edge.rate-limit.policies.register.key=IP
app.edge.rate-limit.policies.register.on-store-error=CLOSED

app.edge.rate-limit.policies.password-reset.capacity=3
app.edge.rate-limit.policies.password-reset.period=15m
app.edge.rate-limit.policies.password-reset.key=IP
app.edge.rate-limit.policies.password-reset.on-store-error=CLOSED

app.edge.rate-limit.policies.refresh.capacity=30
app.edge.rate-limit.policies.refresh.period=1m
app.edge.rate-limit.policies.refresh.key=USER_OR_IP
app.edge.rate-limit.policies.refresh.on-store-error=OPEN

app.edge.rate-limit.policies.chat.capacity=30
app.edge.rate-limit.policies.chat.period=1m
app.edge.rate-limit.policies.chat.key=USER_OR_IP
app.edge.rate-limit.policies.chat.on-store-error=OPEN

server.forward-headers-strategy=framework

