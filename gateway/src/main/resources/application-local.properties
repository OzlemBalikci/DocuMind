server.port=${PORT:8087}

server.tomcat.max-http-form-post-size=${app.gateway.max-request-size:2MB}
server.tomcat.max-swallow-size=${app.gateway.max-request-size:2MB}
spring.servlet.multipart.max-file-size=${app.gateway.max-request-size:2MB}
spring.servlet.multipart.max-request-size=${app.gateway.max-request-size:2MB}

spring.http.clients.connect-timeout=2s
spring.http.clients.read-timeout=30s

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5199}
app.gateway.user-uri=${USER_SERVICE_URI:http://localhost:8081}
app.gateway.document-uri=${DOCUMENT_SERVICE_URI:http://localhost:8082}
app.gateway.chat-uri=${CHAT_SERVICE_URI:http://localhost:8083}
app.gateway.max-request-size=2MB

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:}

resilience4j.circuitbreaker.instances.users.sliding-window-size=20
resilience4j.circuitbreaker.instances.users.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.users.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.users.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.documents.sliding-window-size=20
resilience4j.circuitbreaker.instances.documents.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.documents.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.documents.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.chat.sliding-window-size=20
resilience4j.circuitbreaker.instances.chat.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.chat.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.chat.wait-duration-in-open-state=10s

resilience4j.timelimiter.instances.users.timeout-duration=5s
resilience4j.timelimiter.instances.documents.timeout-duration=5s
resilience4j.timelimiter.instances.chat.timeout-duration=30s

app.edge.rate-limit.redis-uri=${REDIS_URI:redis://localhost:6379}

app.edge.rate-limit.policies.users.capacity=60
app.edge.rate-limit.policies.users.period=1m
app.edge.rate-limit.policies.users.key=USER_OR_IP
app.edge.rate-limit.policies.users.on-store-error=OPEN

app.edge.rate-limit.policies.documents.capacity=60
app.edge.rate-limit.policies.documents.period=1m
app.edge.rate-limit.policies.documents.key=USER_OR_IP
app.edge.rate-limit.policies.documents.on-store-error=OPEN

app.edge.rate-limit.policies.chat.capacity=30
app.edge.rate-limit.policies.chat.period=1m
app.edge.rate-limit.policies.chat.key=USER_OR_IP
app.edge.rate-limit.policies.chat.on-store-error=OPEN

server.forward-headers-strategy=framework
