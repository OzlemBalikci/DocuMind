services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: documind-db
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT}:5432"
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - documind_ms_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/02-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: documind-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: documind-rabbitmq
    restart: unless-stopped
    env_file: .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 30s
      timeout: 10s
      retries: 5

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: documind-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-documind}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-documind-secret}
    ports:
      - "${MINIO_PORT:-9000}:9000"
    volumes:
      - minio_data:/data

  keycloak-db:
    image: postgres:16
    container_name: documind-keycloak-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:?Set KC_DB_PASSWORD in .env}
    volumes:
      - kc-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: documind-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?Set KC_DB_PASSWORD in .env}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?Set KC_ADMIN_PASSWORD in .env}
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_STRICT: false
      KC_HTTP_ENABLED: true
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak/realm-documind.json:/opt/keycloak/data/import/realm-documind.json
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  user-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: user-service
    container_name: documind-user
    restart: unless-stopped
    ports:
      - "${USER_PORT:-8081}:8081"
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/user_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_ISSUER: http://localhost:8180/realms/documind
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/documind/protocol/openid-connect/certs
      KEYCLOAK_ADMIN_BASE_URL: http://keycloak:8080
      KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/documind/protocol/openid-connect/token
      DOCUMENT_SERVICE_URI: http://document-service:8082
      CHAT_SERVICE_URI: http://chat-service:8083
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started

  document-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: document-service
    container_name: documind-document
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/document_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      MINIO_ENDPOINT: http://minio:9000
      KEYCLOAK_ISSUER: http://localhost:8180/realms/documind
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/documind/protocol/openid-connect/certs
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
      keycloak:
        condition: service_started

  ingestion-worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: ingestion-worker
    container_name: documind-ingestion
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/document_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      document-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  chat-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: chat-service
    container_name: documind-chat
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/chat_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_ISSUER: http://localhost:8180/realms/documind
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/documind/protocol/openid-connect/certs
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: gateway
    container_name: documind-gateway
    restart: unless-stopped
    env_file: .env
    ports:
      - "${PORT:-8087}:8087"
    environment:
      SPRING_PROFILES_ACTIVE: local
      PORT: 8087
      USER_SERVICE_URI: http://user-service:8081
      DOCUMENT_SERVICE_URI: http://document-service:8082
      CHAT_SERVICE_URI: http://chat-service:8083
      KEYCLOAK_ISSUER: http://localhost:8180/realms/documind
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/documind/protocol/openid-connect/certs
      REDIS_URI: redis://redis:6379
    depends_on:
      - user-service
      - document-service
      - chat-service
      - redis

volumes:
  documind_ms_pgdata:
  redis_data:
  rabbitmq_data:
  minio_data:
  kc-data:
