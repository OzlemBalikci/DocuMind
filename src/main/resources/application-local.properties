spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5435}/${POSTGRES_DB:interviewpilot_db}
spring.datasource.username=${POSTGRES_USER:interviewpilot_app}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

server.port=${PORT:8087}

spring.ai.openai.api-key=${GROQ_API_KEY:dummy}
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.chat.options.model=${LLM_MODEL:llama-3.3-70b-versatile}
