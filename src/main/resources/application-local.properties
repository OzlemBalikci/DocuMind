spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5435}/${POSTGRES_DB:documind_db}
spring.datasource.username=${local.postgres.username:${SPRING_DATASOURCE_USERNAME:documind_app}}
spring.datasource.password=${local.postgres.password:${SPRING_DATASOURCE_PASSWORD:}}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
server.port=${PORT:8087}

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:documind}
spring.rabbitmq.password=${LOCAL_RABBITMQ_PASSWORD:${local.rabbitmq.password:${RABBITMQ_PASSWORD:}}}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.max-concurrency=1
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=2s
spring.rabbitmq.listener.simple.retry.max-interval=10s
spring.rabbitmq.listener.simple.retry.multiplier=2

# Ollama (Spring AI)
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.init.pull-model-strategy=never
spring.ai.ollama.chat.options.model=${LLM_MODEL:llama3.2:3b}
spring.ai.ollama.chat.options.temperature=0.4
spring.ai.ollama.chat.options.num-predict=1500
spring.ai.ollama.chat.options.num-ctx=4096
spring.ai.ollama.chat.options.format=json

# Uygulama (JWT / LLM seçimi — kod yazınca kullanılacak)
app.jwt.secret=${LOCAL_JWT_SECRET:${local.jwt.secret:${JWT_SECRET:}}}
app.jwt.access-expiration-minutes=15
app.jwt.refresh-expiration-days=7
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5199}
app.llm.provider=${LLM_PROVIDER:mock}
app.llm.daily-limit-per-user=${LLM_DAILY_LIMIT:50}
app.llm.global-daily-limit=${LLM_GLOBAL_DAILY_LIMIT:500}
app.llm.timeout-seconds=${LLM_TIMEOUT_SECONDS:120}
app.llm.max-answer-chars=4000

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

app.mail.host=${MAIL_HOST:}
app.mail.port=${MAIL_PORT:587}
app.mail.username=${MAIL_USERNAME:}
app.mail.password=${MAIL_PASSWORD:}
app.mail.auth=${MAIL_SMTP_AUTH:true}
app.mail.starttls=${MAIL_SMTP_STARTTLS:true}
app.mail.ssl=${MAIL_SMTP_SSL:false}
app.mail.from=${MAIL_FROM:}
app.auth.password-reset.code-ttl=15m
app.auth.password-reset.min-request-interval=1m
app.auth.password-reset.mail-subject=DocuMind password reset code

app.auth.refresh-cookie.name=refresh_token
app.auth.refresh-cookie.path=/api/auth
app.auth.refresh-cookie.secure=false
app.auth.refresh-cookie.same-site=Lax
