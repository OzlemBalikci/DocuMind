spring.application.name=auth-service
spring.config.import=optional:file:.env[.properties]
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Behind Nginx/LB: trust proxy-forwarded headers so HttpServletRequest#getRemoteAddr() is the client IP.
# Only enable when the app is not directly reachable from the internet (clients cannot spoof X-Forwarded-For).
server.forward-headers-strategy=framework

spring.jackson.deserialization.fail-on-unknown-properties=true

